name: AkiDuermo CI
on:
  push:
    branches: [main, "migration/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: akiduermo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3996
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-local-fixture-key
      NEXT_PUBLIC_DATA_PROVIDER: fixtures
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: akiduermo-next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: akiduermo-next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: node tests/fixtures/stay-backend.mjs > /tmp/stay-fixture.log 2>&1 &
      - run: npm run build:cloudflare
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akiduermo-browser-evidence
          path: test-results/
          if-no-files-found: ignore
