name: AkiDuermo CI
on:
  push:
    branches: [main, "migration/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: akiduermo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify_mode:
    strategy:
      matrix:
        independent_accommodation: ["false", "true"]
    runs-on: ubuntu-latest
    env:
      AKISUITE_INDEPENDENT_ACCOMMODATION_ENABLED: ${{ matrix.independent_accommodation }}
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3996
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-local-fixture-key
      NEXT_PUBLIC_DATA_PROVIDER: fixtures
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: akiduermo-next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: akiduermo-next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: node tests/fixtures/stay-backend.mjs > /tmp/stay-fixture.log 2>&1 &
      - run: npm run build:cloudflare
      - run: npm run dry-run:cloudflare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akiduermo-browser-evidence-${{ matrix.independent_accommodation }}
          path: test-results/
          if-no-files-found: ignore

  verify:
    needs: verify_mode
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both accommodation modes
        env:
          MODE_RESULT: ${{ needs.verify_mode.result }}
        run: test "$MODE_RESULT" = "success"
